name: Backend checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  backend:
    name: Pytest and Ruff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install backend and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run backend tests, including rule golden cases and API gate tests
        run: python -m pytest
      - name: Run Ruff
        run: ruff check sanad_api tests
      - name: Model evaluation harness in replay mode (no key, no network; RF-23)
        run: python ../../eval/run_model_eval.py --out "$RUNNER_TEMP/scorecard" --baseline ../../eval/baseline/replay.json
