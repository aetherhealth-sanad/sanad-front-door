name: Web checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  web:
    name: Type-check, build and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build
      - run: npm run lint
