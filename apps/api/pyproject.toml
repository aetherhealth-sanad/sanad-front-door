[project]
name = "sanad-api"
version = "0.1.0"
description = "Sanad referral-flow API. Research prototype, not a medical device. Synthetic data only."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7",
    "jsonschema>=4.22",
    "python-multipart>=0.0.9",
    # Reads apps/api/.env for local settings. Real environment variables still win.
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# T4.5, CC-011: only needed when SANAD_MODEL_PROVIDER=azure_openai. The default install makes
# no model call. The adapter was written against openai 3.x (v1 API, no api_version).
azure = [
    "openai>=3.40,<4",
    "azure-identity>=1.17",
]
# RF-25, CC-015: only needed when SANAD_MODEL_PROVIDER=laya_local. Pulls torch and transformers.
decision = [
    "laya>=0.4.31,<0.5",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    # Adapter tests use the SDK's own error and response types. They make no network call.
    "openai>=3.40,<4",
    # RF-29 / T-60 tests read synthetic lab report PDFs. reportlab only draws test documents.
    "pdfplumber>=0.11",
    "reportlab>=4.2",
]
# RF-29, T-60, CC-021 (PROPOSED): reads the text layer of a synthetic lab report PDF. No
# endpoint uses it yet.
documents = [
    "pdfplumber>=0.11",
]
# RF-29, T-60 (PROPOSED): local OCR for a page with no text layer. Off unless installed and
# passed to the extractor. The models ship in the package; reading makes no network call.
# numpy straightens scanned pages. Tesseract, the baseline engine, is a system package.
ocr = [
    "pdfplumber>=0.11",
    "rapidocr>=3.10,<4",
    "onnxruntime>=1.20",
    "numpy>=2",
]
observability = [
    "langfuse>=5,<6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sanad_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Query",
    "sanad_api.auth.rate_limit.rate_limited",
    "sanad_api.cases.guards.guard",
]

[tool.mypy]
python_version = "3.12"
files = ["sanad_api"]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["jsonschema.*", "pdfplumber.*", "pypdfium2.*", "reportlab.*", "rapidocr.*"]
ignore_missing_imports = true
